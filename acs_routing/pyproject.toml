[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acs-routing"
version = "0.1.0"
description = "Weekly route planning for community health agent home visits."
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
osrm = ["requests>=2.31"]
test = ["pytest>=7.4"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: requires a configured external OSRM service"]

[tool.setuptools.packages.find]
include = ["acs_routing*"]
